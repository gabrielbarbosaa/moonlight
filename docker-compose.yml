services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moonlight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moonlight}
      POSTGRES_DB: ${POSTGRES_DB:-moonlight}
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-moonlight}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data

  # Caixa de entrada fake para o 2FA e lembretes: http://localhost:8026
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1026:1025'
      - '8026:8025'

volumes:
  pgdata:
  redisdata:
